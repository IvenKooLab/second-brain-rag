[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-rag"
version = "0.2.0"
description = "A local 'second brain': RAG over your scattered notes and docs, with an MCP server so AI agents can use it too."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IvenKooLab" }]
keywords = ["rag", "second-brain", "mcp", "obsidian", "chromadb", "local-first", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "openai>=1.50",
    "chromadb>=0.5",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
second-brain = "second_brain.cli:main"
second-brain-mcp = "second_brain.mcp_server:serve"

[project.urls]
Homepage = "https://github.com/IvenKooLab/second-brain-rag"
Changelog = "https://github.com/IvenKooLab/second-brain-rag/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/IvenKooLab/second-brain-rag/blob/main/docs/roadmap.md"

[tool.setuptools.packages.find]
where = ["src"]
