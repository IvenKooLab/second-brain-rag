# ==== 复制为 config.toml 并填入你的值 ====

[llm]
base_url = "https://open.bigmodel.cn/api/paas/v4"   # 智谱；DeepSeek/Kimi/OpenAI 换成对应端点
api_key = "your-api-key-here"                        # 或设环境变量 BRAIN_LLM_API_KEY
model = "glm-4.6"                                    # 对话模型

[embed]
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key = "your-api-key-here"                        # 或设环境变量 BRAIN_EMBED_API_KEY
model = "embedding-3"                                # 向量模型

# 要灌入的文档目录（递归扫描 .md / .txt）
[[sources]]
path = "D:/notes"                                    # 改成你的目录
# path = "E:/work/gitee/minimax-h3-turing/docs"     # 可配多个

[chunk]
size = 800        # 切分目标长度（字符）
overlap = 100     # 相邻切分重叠

[top_k]
search = 5        # 检索条数

[store]
path = "./chroma_db"   # 向量库落盘位置
